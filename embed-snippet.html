<!--
  STAFF RESOURCE CENTER embed.

  ELEMENTOR SETUP -- both steps matter, and doing only one leaves a
  letterboxed frame with theme padding around it.

  1. PAGE TEMPLATE
     Edit the page in Elementor. Bottom-left gear icon (Page Settings)
     -> Page Layout -> pick one:

       Elementor Canvas      No theme header, footer or sidebar. The
                             embed is the whole page. Recommended: this
                             page already carries its own Diaper Dollars
                             header and a footer linking back to
                             modcollective.org, so the theme chrome is
                             duplicated furniture.

       Elementor Full Width  Keeps MOD's site header and footer, removes
                             the content-width constraint. Use this if
                             you want the page to sit inside the normal
                             site navigation.

  2. CONTAINER PADDING
     Select the Section or Container holding the HTML widget.
       Layout tab   -> Content Width: Full Width
                    -> Columns Gap: No Gap   (Sections only)
       Advanced tab -> Padding: 0 on all four sides
                    -> Margin: 0 on all four sides
     Then select the HTML widget itself:
       Advanced tab -> Padding 0, Margin 0

  IF THE HEIGHT DOES NOT ADJUST BY ITSELF
     WordPress strips script tags for roles without the unfiltered_html
     capability, and some security plugins strip them regardless. Save the
     page while logged in as an Administrator. Without the script the frame
     falls back to a fixed height and scrolls internally, which works but
     looks wrong.

  This is the only thing that ever goes on the MOD site for the staff
  page. Content changes after this happen by pushing to the repo; the
  iframe picks them up on its own.

  DO NOT CONFUSE THIS WITH THE FAMILY EMBED
     embed-snippet-families.html is the family guide, and belongs on a
     different page.
-->

<iframe
  id="ddpp-frame"
  src="https://ddpp-resource-center.netlify.app/"
  title="DDPP Resource Center"
  style="width:100%; border:0; display:block; min-height:900px; height:3200px;"
  loading="lazy"></iframe>

<script>
(function () {
  var frame = document.getElementById('ddpp-frame');
  var allowed = 'https://ddpp-resource-center.netlify.app';
  if (!frame) return;

  window.addEventListener('message', function (e) {
    // Only trust messages from our own frame, on the expected origin.
    if (e.origin !== allowed) return;
    if (e.source !== frame.contentWindow) return;
    if (!e.data || typeof e.data !== 'object') return;

    if (e.data.ddppHeight) {
      var h = parseInt(e.data.ddppHeight, 10);
      // Ignore nonsense values rather than collapsing the page around them.
      if (!isNaN(h) && h > 200 && h < 20000) {
        frame.style.height = (h + 20) + 'px';
      }
    }

    if (e.data.ddppScrollTop) {
      var top = frame.getBoundingClientRect().top + window.pageYOffset - 100;
      window.scrollTo({ top: top, behavior: 'smooth' });
    }
  });
})();
</script>
