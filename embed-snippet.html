<!--
  Paste this into an Elementor HTML widget on the MOD Collective page.
  Replace every instance of YOUR-SITE-NAME with your Netlify subdomain.

  This is the only thing that ever goes on the MOD site. Content changes
  after this happen by pushing to the repo; the iframe picks them up on
  its own. You will not need to touch this again.
-->

<iframe
  id="ddpp-frame"
  src="https://YOUR-SITE-NAME.netlify.app/"
  title="DDPP Resource Center"
  style="width:100%; border:0; display:block; min-height:900px; height:1400px;"
  loading="lazy"></iframe>

<script>
(function () {
  var frame = document.getElementById('ddpp-frame');
  var allowed = 'https://YOUR-SITE-NAME.netlify.app';
  if (!frame) return;

  window.addEventListener('message', function (e) {
    // Only trust messages from our own frame, on the expected origin.
    if (e.origin !== allowed) return;
    if (e.source !== frame.contentWindow) return;
    if (!e.data || typeof e.data !== 'object') return;

    if (e.data.ddppHeight) {
      var h = parseInt(e.data.ddppHeight, 10);
      // Ignore nonsense values rather than collapsing the page around them.
      if (!isNaN(h) && h > 200 && h < 20000) {
        frame.style.height = (h + 20) + 'px';
      }
    }

    if (e.data.ddppScrollTop) {
      var top = frame.getBoundingClientRect().top + window.pageYOffset - 100;
      window.scrollTo({ top: top, behavior: 'smooth' });
    }
  });
})();
</script>
